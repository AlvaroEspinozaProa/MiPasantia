<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "base.html" %}

{% block contenido %}

<article class="experiencia-completa">

    <h2>
        {{ experiencia["titulo"] }}
    </h2>

    <p>
        <strong>Empresa:</strong>
        {{ experiencia["empresa"] }}
    </p>

    <p>
        <strong>Autor:</strong>
        {{ experiencia["nombre"] }}
    </p>

    <p>
        <strong>Fecha:</strong>
        {{ experiencia["fecha"] }}
    </p>

    <hr>

    <p class="texto-experiencia">

        {{ experiencia["contenido"] }}

    </p>

</article>

{% endblock %}
</body>
</html>
