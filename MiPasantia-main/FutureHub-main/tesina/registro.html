<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Mi Pasantía</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Mi Pasantía</h1>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="publicar.html">Publicar experiencia</a>
        <a href="galeria.html">Galería</a>
        <a href="foro.html">Foro</a>
        <a href="test.html">Test vocacional</a>
        <a href="login.html">Iniciar sesión</a>
    </nav>

</header>

<main>

<div class="formulario">

    <h2>Crear una cuenta</h2>

    <p class="descripcion">
        Registrate para compartir tus experiencias y leer las publicaciones de otros estudiantes.
    </p>

    <form action="#" method="POST">

        <label for="nombre">
            Nombre completo
        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingresá tu nombre"
            required
        >

        <label for="email">
            Correo electrónico
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
        >

        <label for="password">
            Contraseña
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Creá una contraseña"
            required
        >

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p class="registro">
        ¿Ya tenés una cuenta?
        <a href="login.html">Iniciá sesión aquí</a>
    </p>

</div>

</main>

<footer>

    <p>© 2026 - Mi Pasantía</p>

</footer>

</body>
</html>
